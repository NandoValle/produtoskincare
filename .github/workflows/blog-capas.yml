name: Blog - gerar capas (temporario)

on:
  push:
    branches: [claude/gracious-franklin-2dsup2]
    paths: [.github/workflows/blog-capas.yml]

permissions:
  contents: write

jobs:
  capas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gracious-franklin-2dsup2

      - name: Baixar originais (fora do repositorio)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/orig"; mkdir -p "$D"
          B="https://elevenlabsusercontent.com/database/workspace/fa96d1efa6854c6fbe4e1fba50c36c27/content_generation"
          Q="KeyName=assets-cdn-key-1"
          curl -fsS -o "$D/protetor-solar-pele-oleosa.png"  "$B/qJrOXPexbrPexIg6rCGr/dgzePkgu3PjwqfkeLUmp/content.png?Expires=1793912400&$Q&Signature=pS21VGOSBcqs6Aw4i1KK5Nuk3Io="
          curl -fsS -o "$D/ordem-dos-produtos-skincare.png" "$B/w6PMEFLQquWEgAjJ5T66/u7fefpvg2KpmMfmUTyIf/content.png?Expires=1793912400&$Q&Signature=RcPe4Heuz4OiEFh5JvOtAkPNKV4="
          curl -fsS -o "$D/rotina-de-skincare-barata.png"   "$B/YrShBpjxCOBXiapqQUkk/9D4YDql5dRPtUwD5bG2J/content.png?Expires=1793912400&$Q&Signature=OgB_NtFOIOGII4JaD6KNaWpyjQg="
          curl -fsS -o "$D/protetor-solar-com-cor.png"      "$B/zsxo27i5h6i4qMp8QHFd/34h1BP97pUXruN0iv18C/content.png?Expires=1793912400&$Q&Signature=OabnZiL8wB0tVWcoXpNlih-tvjk="
          curl -fsS -o "$D/skincare-pele-negra.png"         "$B/bBmSqyUE7d9uWvE44TwJ/WHvFaVyHZ7QZJycnzVfi/content.png?Expires=1793912400&$Q&Signature=SOvXJqT1eV3RhwRDUzCBek7GW3U="
          curl -fsS -o "$D/skincare-masculino.png"          "$B/fL2xLZB5W6XkWhvHmMG9/lJloB5hdeifVY0Tu4ctS/content.png?Expires=1793912400&$Q&Signature=fj0acrL9gMg0B8eikaOGxmNrGlE="
          curl -fsS -o "$D/skincare-para-adolescentes.png"  "$B/9PnZEisQWzcuul0vrsU0/4Pqv38g7nAFJBCWvihNl/content.png?Expires=1793912400&$Q&Signature=txFvCc0fMPha_z9I1dkGTGJ88pw="
          ls -la "$D"

      - name: Gerar WebP
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 - <<'PY'
          import os, sys
          from PIL import Image
          src = os.path.join(os.environ["RUNNER_TEMP"], "orig")
          out = "img/blog"; os.makedirs(out, exist_ok=True)
          slugs = ["protetor-solar-pele-oleosa", "ordem-dos-produtos-skincare", "rotina-de-skincare-barata", "protetor-solar-com-cor", "skincare-pele-negra", "skincare-masculino", "skincare-para-adolescentes"]
          L = Image.Resampling.LANCZOS
          for s in slugs:
              im = Image.open(os.path.join(src, s + ".png")).convert("RGB")
              print(s, im.size)
              if im.size != (3840, 2160):
                  sys.exit(f"{s}: tamanho inesperado {im.size}")
              im.save(f"{out}/{s}-3840.webp", "WEBP", quality=82, method=6)
              im.resize((1600, 900), L).save(f"{out}/{s}-1600.webp", "WEBP", quality=80, method=6)
              im.resize((800, 450), L).save(f"{out}/{s}-800.webp", "WEBP", quality=78, method=6)
          PY
          ls -la img/blog

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add img/blog
          git commit -m "Blog: adiciona capas 4K dos 7 artigos novos"
          git push origin HEAD:claude/gracious-franklin-2dsup2
