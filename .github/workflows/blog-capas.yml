name: Blog - gerar capas (temporario)

on:
  push:
    branches: [claude/gracious-franklin-2dsup2]
    paths: [.github/workflows/blog-capas.yml]

permissions:
  contents: write

jobs:
  capas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gracious-franklin-2dsup2

      - name: Baixar originais (fora do repositorio)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/orig"; mkdir -p "$D"
          B="https://elevenlabsusercontent.com/database/workspace/fa96d1efa6854c6fbe4e1fba50c36c27/content_generation"
          curl -fsS -o "$D/como-saber-tipo-de-pele.png"    "$B/22FsPQXBZt47AElvC1aX/2jGyuqTiYQgAf5RaHtz8/content.png?Expires=1793782800&KeyName=assets-cdn-key-1&Signature=uEJT-HJ_ZGI0UE-kGbW1rSTAxaI="
          curl -fsS -o "$D/retinol-como-comecar.png"       "$B/jjUCd9y22NttDayfgBOR/wFcvWQHAM5mUyqEroSTg/content.png?Expires=1793782800&KeyName=assets-cdn-key-1&Signature=unIbFAEYfy27SE9stPtYosfA1QI="
          curl -fsS -o "$D/vitamina-c-skincare.png"        "$B/bTmWw3H0B1BDsFWStbCN/8b08jxkFQH7zUViNDqra/content.png?Expires=1793782800&KeyName=assets-cdn-key-1&Signature=YfHuPNSLGRIxu1BatPk9YV9KB6w="
          curl -fsS -o "$D/protetor-solar-importancia.png" "$B/d3plh76tAXv4JQv1iEyL/lers9hfDkGNBrSJeVNK5/content.png?Expires=1793782800&KeyName=assets-cdn-key-1&Signature=WokSmy-HCijKXWwfFVIiHD-QhzE="
          ls -la "$D"

      - name: Gerar WebP e JPG
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 - <<'PY'
          import os, sys
          from PIL import Image
          src = os.path.join(os.environ["RUNNER_TEMP"], "orig")
          out = "img/blog"; os.makedirs(out, exist_ok=True)
          slugs = ["como-saber-tipo-de-pele", "retinol-como-comecar", "vitamina-c-skincare", "protetor-solar-importancia"]
          L = Image.Resampling.LANCZOS
          for s in slugs:
              im = Image.open(os.path.join(src, s + ".png")).convert("RGB")
              print(s, im.size)
              if im.size != (3840, 2160):
                  sys.exit(f"{s}: tamanho inesperado {im.size}")
              im.save(f"{out}/{s}-3840.webp", "WEBP", quality=82, method=6)
              im.resize((1600, 900), L).save(f"{out}/{s}-1600.webp", "WEBP", quality=80, method=6)
              im.resize((800, 450), L).save(f"{out}/{s}-800.webp", "WEBP", quality=78, method=6)
              im.resize((1200, 675), L).save(f"{out}/{s}-og.jpg", "JPEG", quality=84, optimize=True, progressive=True)
          PY
          ls -la img/blog

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add img/blog
          git commit -m "Blog: adiciona arquivos das capas 4K"
          git push origin HEAD:claude/gracious-franklin-2dsup2
